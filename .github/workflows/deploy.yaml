name: Deploy to plust.dk via FTP
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # byg hvis du har et build-step (fx Vite/React) – ellers slet de 3 næste linjer
      - uses: actions/setup-node@v4
      - run: npm ci
      - run: npm run build

      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: dist # brug "." hvis du ikke har build-folder
          server-dir: /   # din webroot er / som på dit screenshot
          dangerous-clean-slate: false